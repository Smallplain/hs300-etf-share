name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main branch root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d "$payload")
          echo "POST /pages -> ${code}"
          cat /tmp/pages.json
          echo
          if [ "${code}" = "409" ] || [ "${code}" = "422" ]; then
            code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              -d '{"source":{"branch":"main","path":"/"}}')
            echo "PUT /pages -> ${code}"
            cat /tmp/pages.json
            echo
          fi
          if [ "${code}" != "201" ] && [ "${code}" != "204" ] && [ "${code}" != "200" ]; then
            echo "Failed to enable GitHub Pages (HTTP ${code})"
            exit 1
          fi
          curl -sS -o /tmp/pages-get.json -w "GET /pages -> %{http_code}\n" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          cat /tmp/pages-get.json
          echo
          curl -sS -o /tmp/build.json -w "POST /pages/builds -> %{http_code}\n" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" || true
          cat /tmp/build.json || true
          echo
